# Package profiles for Archmage (parsed by lib/packages.sh)
# Format: profile_name: packages are listed under "packages:"

base_always:
  packages:
    - base
    - linux-firmware
    - nano
    - man-db
    - man-pages
    - texinfo
    - networkmanager
    - sudo
    - net-tools

bootloader_systemd_boot:
  packages:
    - systemd
    - efibootmgr

bootloader_grub:
  packages:
    - grub
    - efibootmgr

extras_audio:
  packages:
    - pipewire
    - wireplumber
    - pipewire-pulse
    - pipewire-alsa

extras_bluetooth:
  packages:
    - bluez
    - bluez-utils

desktop_none:
  packages: []

desktop_kde:
  packages:
    - plasma-meta
    - kde-applications
    - mesa
    - polkit-kde-agent
    - xdg-desktop-portal-kde
    - xdg-desktop-portal-gtk
  display_manager: sddm
  display_manager_pkg: sddm
  notes: graphical.target, SDDM (Wayland), session groups. Log in at the greeter after reboot.

desktop_gnome:
  packages:
    - gnome
    - gnome-extra
    - mesa
    - xdg-desktop-portal-gnome
    - xdg-desktop-portal-gtk
  display_manager: gdm
  display_manager_pkg: gdm
  notes: graphical.target, GDM, session groups. Log in at the greeter after reboot.

desktop_xfce:
  packages:
    - xfce4
    - xfce4-goodies
    - mesa
    - polkit-gnome
    - xdg-desktop-portal-gtk
  display_manager: lightdm
  display_manager_pkg: lightdm lightdm-gtk-greeter
  notes: graphical.target, LightDM, session groups. Log in at the greeter after reboot.

desktop_hyprland:
  packages:
    - hyprland
    - mesa
    - waybar
    - wofi
    - kitty
    - polkit
    - hyprpolkitagent
    - seatd
    - xdg-desktop-portal
    - xdg-desktop-portal-hyprland
    - xdg-desktop-portal-gtk
  display_manager: ""
  notes: seatd, seat group, minimal config, autostart on tty1. No display manager.
